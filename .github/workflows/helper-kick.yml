# Helper kick: starts "Helper poll" on every helper fork that has an
# experiment share waiting, so nobody has to press "Run workflow" by hand.
#
# Uses one secret, HELPER_KICK_PAT: a classic personal access token of the
# repository owner with only the public_repo scope (the owner must be a
# collaborator with write access on each fork). Locked down on purpose:
# - runs only on its schedule or by "Run workflow" here (never on pull
#   requests or from forks, so no fork can reach the secret);
# - checks out no code: the script is inline, so nothing in any repository
#   can change what runs with the token;
# - its only write calls are the workflow-dispatch of helper-poll.yml on
#   forks of this repository, and GitHub's own "Sync fork" (merge-upstream,
#   which fast-forwards a fork, merges ours in alongside the owner's own
#   changes when they do not conflict, and is refused by GitHub when they
#   do: such a fork is left as it is) for the forks listed under "sync" in
#   notes/volunteers.json (helper IDs, or "all"). Syncing a version that
#   changes .github/workflows needs the token's "workflow" scope as well.
#   The job's own GITHUB_TOKEN has no permissions.
name: Helper kick

on:
  schedule:
    - cron: "7,22,37,52 * * * *"
  workflow_dispatch:
  # A test just distributed (notes/scripts/distribute.sh pushes these):
  # start the forks at once instead of waiting for the schedule.
  push:
    branches: ["helper-exp/**"]

permissions: {}

concurrency:
  group: helper-kick
  cancel-in-progress: false

jobs:
  kick:
    if: github.repository == 'Demonic1594/Smotherfish'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Start Helper poll where a share is waiting
        env:
          PAT: ${{ secrets.HELPER_KICK_PAT }}
        run: |
          if [ -z "$PAT" ]; then echo "HELPER_KICK_PAT is not set: nothing to do."; exit 0; fi
          echo "::add-mask::$PAT"
          python3 - <<'PY'
          import hashlib, json, os, subprocess, urllib.request
          MAIN = "Demonic1594/Smotherfish"
          TOKEN = os.environ["PAT"]

          def api(path, data=None):
              req = urllib.request.Request("https://api.github.com" + path,
                  data=json.dumps(data).encode() if data is not None else None,
                  method="POST" if data is not None else "GET",
                  headers={"Authorization": "Bearer " + TOKEN, "Accept": "application/vnd.github+json",
                           "X-GitHub-Api-Version": "2022-11-28", "User-Agent": "smotherfish-helper-kick"})
              try:
                  with urllib.request.urlopen(req, timeout=30) as r:
                      return r.status, (json.loads(r.read() or b"null"))
              except urllib.error.HTTPError as e:
                  try:
                      msg = json.loads(e.read() or b"{}").get("message", "")
                  except Exception:
                      msg = ""
                  return e.code, {"message": msg}

          def heads(url, pattern):
              out = subprocess.run(["git", "ls-remote", url, pattern], capture_output=True, text=True).stdout
              return {l.split("\t")[1].split("refs/heads/", 1)[1] for l in out.splitlines() if "\t" in l}

          waiting = heads(f"https://github.com/{MAIN}", "refs/heads/helper-exp/*")
          # Sync requests: notes/volunteers.json "sync" on the default branch.
          import base64
          st, cfg = api(f"/repos/{MAIN}/contents/notes/volunteers.json?ref=smotherfish")
          try:
              vconf = json.loads(base64.b64decode(cfg["content"])) if st == 200 else {}
          except Exception:
              vconf = {}
          want_sync = set(vconf.get("sync", []))
          excluded = set(vconf.get("exclude", []))  # forks taken off the list (e.g. made private)
          forks, page = [], 1
          while True:
              st, d = api(f"/repos/{MAIN}/forks?per_page=100&page={page}")
              if st != 200 or not d: break
              forks += d; page += 1
              if len(d) < 100: break
          kicked = 0
          for f in forks:
              repo = f["full_name"]
              if f.get("parent", {}).get("full_name", MAIN) != MAIN and f.get("source", {}).get("full_name", MAIN) != MAIN:
                  continue
              hid = hashlib.sha256(f["owner"]["login"].lower().encode()).hexdigest()[:6]
              if hid in excluded:
                  continue
              mine = {b.split("/", 2)[2] for b in waiting if b.count("/") == 2 and b.split("/")[1] == hid}
              mine |= {b.split("/", 1)[1] for b in waiting if b.count("/") == 1}
              started = {b.split("/", 1)[1] for b in heads(f"https://github.com/{repo}", "refs/heads/actions-exp/*")}
              todo = sorted(mine - started)
              # Never sync a fork with a share it has not copied yet: the share was
              # built on the fork's current version, and syncing first would give
              # the fork other workflow files, so GitHub would refuse the copy.
              if ("all" in want_sync or hid in want_sync) and not todo:
                  branch = f.get("default_branch", "smotherfish")
                  req = urllib.request.Request(f"https://api.github.com/repos/{repo}/merge-upstream",
                      data=json.dumps({"branch": branch}).encode(), method="POST",
                      headers={"Authorization": "Bearer " + TOKEN, "Accept": "application/vnd.github+json",
                               "X-GitHub-Api-Version": "2022-11-28", "User-Agent": "smotherfish-helper-kick"})
                  try:
                      with urllib.request.urlopen(req, timeout=30) as r:
                          kind = json.loads(r.read() or b"{}").get("merge_type", "?")
                      if kind != "none":
                          print(f"{hid}: synced with this repository ({kind})")
                          # Fill its Maia-3 cache on the new default-branch version.
                          api(f"/repos/{repo}/actions/workflows/maia-cache.yml/dispatches", {"ref": branch})
                  except urllib.error.HTTPError as e:
                      if e.code == 409:
                          # The owner's own work conflicts with ours: leave the fork as it is.
                          # Its test shares are built on the newest version it contains.
                          print(f"{hid}: has changes of its own that conflict; not synced (left as is)")
                      else:
                          print(f"::warning::{hid}: could not sync (HTTP {e.code})")
              if not todo:
                  print(f"{hid}: nothing waiting"); continue
              st, _ = api(f"/repos/{repo}/actions/workflows/helper-poll.yml/dispatches", {"ref": f.get("default_branch", "smotherfish")})
              if st == 422:
                  # The workflow is disabled on the fork (GitHub can do this, e.g. after
                  # Actions were paused): enable it and try once more.
                  req = urllib.request.Request(f"https://api.github.com/repos/{repo}/actions/workflows/helper-poll.yml/enable",
                      method="PUT", headers={"Authorization": "Bearer " + TOKEN, "Accept": "application/vnd.github+json",
                                             "X-GitHub-Api-Version": "2022-11-28", "User-Agent": "smotherfish-helper-kick"})
                  try:
                      urllib.request.urlopen(req, timeout=30); print(f"{hid}: re-enabled Helper poll")
                  except urllib.error.HTTPError as e:
                      print(f"::warning::{hid}: could not re-enable Helper poll (HTTP {e.code})")
                  st, body = api(f"/repos/{repo}/actions/workflows/helper-poll.yml/dispatches", {"ref": f.get("default_branch", "smotherfish")})
              if st in (200, 204):
                  kicked += 1; print(f"{hid}: started Helper poll ({len(todo)} waiting: {', '.join(todo[:3])}{' ...' if len(todo) > 3 else ''})")
              else:
                  print(f"::warning::{hid}: could not start Helper poll (HTTP {st}: {(body or {}).get('message', '')}): the owner must add this account as a collaborator with write access, and workflows must be enabled")
          print(f"kicked {kicked} fork(s)")
          PY
