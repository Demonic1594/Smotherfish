# Smother experiments: paired-game matches against stock Stockfish 19 at
# UCI_Elo N, spread over parallel runners. Triggered by a push to a branch
# named actions-exp/<anything>; the plan is notes/exp/plan.json on that branch
# (see notes/scripts/expand_plan.py). Results are committed back to the
# branch under notes/results/<exp>/ and summarised in the run summary.
name: Smother experiment

on:
  push:
    branches: ["actions-exp/**"]
    paths: ["notes/exp/plan.json"]
  # Started by the helper poll in a volunteer's fork (helper-poll.yml).
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: ${{ github.ref }}
  cancel-in-progress: true

env:
  OPPONENT_COMMIT: edb0d9db6731067ec50ce619ff372b463bc4dd5d  # stock Stockfish 19
  ARCH: x86-64-avx2

jobs:
  plan:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.m.outputs.matrix }}
      exp: ${{ steps.m.outputs.exp }}
      maia: ${{ steps.m.outputs.maia }}
      maxpar: ${{ steps.m.outputs.maxpar }}
      ref: ${{ steps.m.outputs.ref }}
    steps:
      - uses: actions/checkout@v4
      - id: m
        run: python3 notes/scripts/expand_plan.py notes/exp/plan.json >> "$GITHUB_OUTPUT"

  build:
    needs: plan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build Smotherfish
        run: |
          cd src
          make -j"$(nproc)" net
          make -j"$(nproc)" build ARCH=$ARCH
          ./stockfish bench 2>&1 | grep "Nodes searched"
      - name: Build stock Stockfish 19 (opponent)
        run: |
          git fetch --depth 1 origin $OPPONENT_COMMIT
          mkdir -p opp && git archive $OPPONENT_COMMIT src scripts | tar -x -C opp
          cp src/nn-*.nnue opp/src/
          cd opp/src && make -j"$(nproc)" build ARCH=$ARCH
          ./stockfish bench 2>&1 | grep "Nodes searched"
      - name: Build the reference engine (plan "ref")
        if: needs.plan.outputs.ref != ''
        run: |
          git fetch origin "${{ needs.plan.outputs.ref }}"
          mkdir -p ref && git archive FETCH_HEAD src scripts | tar -x -C ref
          cd ref/src
          make -j"$(nproc)" net
          make -j"$(nproc)" build ARCH=$ARCH
          ./stockfish bench 2>&1 | grep "Nodes searched"
      - name: Build lc0 and fetch Maia networks
        if: needs.plan.outputs.maia != ''
        run: |
          sudo apt-get install -y -q libopenblas-dev ninja-build >/dev/null
          pip install -q meson
          tag=$(git ls-remote --tags https://github.com/LeelaChessZero/lc0.git \
                | grep -o 'refs/tags/v0\.[0-9]*\.[0-9]*$' | sed 's#refs/tags/##' | sort -V | tail -1)
          echo "lc0 $tag"
          git clone -q --depth 1 --branch "$tag" --recurse-submodules https://github.com/LeelaChessZero/lc0.git lc0
          # Portable build: runners differ in CPU (some lack AVX-512), and a
          # binary tuned for the build machine dies at start on the others.
          (cd lc0 && ./build.sh -Dnative_arch=false >/dev/null)
          echo uci | lc0/build/release/lc0 2>/dev/null | grep -q uciok && echo "lc0 starts"
          mkdir -p maia
          for r in ${{ needs.plan.outputs.maia }}; do
            curl -fsSL -o maia/maia-$r.pb.gz \
              "https://github.com/CSSLab/maia-chess/raw/master/maia_weights/maia-$r.pb.gz" \
            || curl -fsSL -o maia/maia-$r.pb.gz \
              "https://github.com/CSSLab/maia-chess/releases/download/v1.0/maia-$r.pb.gz"
          done
          ls -la maia lc0/build/release/lc0
      - name: Collect engines
        run: |
          mkdir -p engines
          cp src/stockfish engines/ours
          cp opp/src/stockfish engines/opp
          if [ -d ref ]; then cp ref/src/stockfish engines/ref; fi
          if [ -d maia ]; then cp lc0/build/release/lc0 engines/lc0; cp maia/*.pb.gz engines/; fi
      - uses: actions/upload-artifact@v4
        with:
          name: engines
          path: engines/
          retention-days: 3

  match:
    needs: [plan, build]
    # "runner": "self" in the plan sends a job to the self-hosted runner (a
    # volunteer's machine); everything else runs on GitHub's runners.
    runs-on: ${{ matrix.runner == 'self' && fromJSON('["self-hosted", "Linux", "X64"]') || 'ubuntu-latest' }}
    timeout-minutes: 90
    strategy:
      fail-fast: false
      # Jobs at once: the plan's "max_parallel" (default 18, within a free
      # account's 20); an Enterprise account allows up to 500.
      max-parallel: ${{ fromJSON(needs.plan.outputs.maxpar) }}
      matrix:
        include: ${{ fromJson(needs.plan.outputs.matrix) }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: engines
          path: engines
      - run: chmod +x engines/*
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -q chess
      - if: startsWith(matrix.opp, 'maia-')
        run: sudo apt-get install -y -q libopenblas0 >/dev/null
      # Maia-3 in its own virtualenv plus the downloaded network, cached per
      # repository: the first Maia job of a fork installs it (about a minute),
      # later jobs restore it in seconds.
      - name: Restore Maia-3 (cache)
        id: maia3cache
        if: startsWith(matrix.opp, 'maia3-')
        uses: actions/cache@v4
        with:
          path: |
            ~/maia3env
            ~/.cache/huggingface
          key: maia3-1e13597c-torch2.15.0-${{ runner.os }}-${{ runner.arch }}-v1
      - name: Install Maia-3 (human-like, any rating)
        if: startsWith(matrix.opp, 'maia3-')
        run: |
          # Pinned to the versions tested (Nov 21): maia3 1e13597c, torch 2.15.0 CPU.
          if [ ! -x ~/maia3env/bin/maia3-uci ]; then
            python3 -m venv ~/maia3env
            ~/maia3env/bin/pip install -q torch==2.15.0 --index-url https://download.pytorch.org/whl/cpu
            git clone -q https://github.com/CSSLab/maia3.git /tmp/maia3
            git -C /tmp/maia3 checkout -q 1e13597c42d4858b7cfd7cfdae01e297263364b2
            ~/maia3env/bin/pip install -q /tmp/maia3
            ~/maia3env/bin/maia3-cache --model maia3-5m
          fi
          m=$HOME/maia3env/bin/maia3-uci
          printf '#!/bin/sh\nexport OMP_NUM_THREADS=1 MKL_NUM_THREADS=1 HF_HUB_OFFLINE=1\nexec %s --model maia3-5m --device cpu --no-use-amp "$@"\n' "$m" > engines/maia3
          chmod +x engines/maia3
          # Answers within seconds; the old check waited a fixed 30 s.
          timeout 90 python3 - "engines/maia3" <<'PY'
          import subprocess, sys
          p = subprocess.Popen(sys.argv[1:], stdin=subprocess.PIPE, stdout=subprocess.PIPE, text=True)
          p.stdin.write("uci\nisready\nposition startpos\ngo nodes 1\n"); p.stdin.flush()
          for line in p.stdout:
              if line.startswith("bestmove"):
                  print(line.strip()); break
          p.kill()
          PY
      - name: Play ${{ matrix.name }} chunk ${{ matrix.chunk }}
        env:
          OPENBLAS_NUM_THREADS: "1"  # one BLAS thread per lc0 process
          MATCH_DEBUG: "600"         # stack dumps every 10 min if a job gets stuck
        run: |
          mkdir -p out
          # Games at once: all cores on GitHub's runners. On a volunteer's
          # machine, SMOTHER_CORES (runner .env) if set, else half the
          # physical cores while it is idle and 4 when the owner is using it
          # (2+ threads busy over 3 s before the job starts; the load average
          # would still count our own previous job).
          conc=$(nproc)
          if [ "${{ matrix.runner }}" = "self" ]; then
            half=$(( $(nproc) / 4 )); [ "$half" -lt 1 ] && half=1
            if [ -n "$SMOTHER_CORES" ]; then conc=$SMOTHER_CORES
            else
              read -r _ a1 b1 c1 d1 e1 f1 g1 _ < /proc/stat; sleep 3
              read -r _ a2 b2 c2 d2 e2 f2 g2 _ < /proc/stat
              busy=$(( (a2+b2+c2+f2+g2) - (a1+b1+c1+f1+g1) ))
              total=$(( busy + (d2+e2) - (d1+e1) ))
              used=$(( busy * $(nproc) / (total > 0 ? total : 1) ))
              if [ "$used" -ge 2 ]; then conc=4; else conc=$half; fi
              [ "$conc" -gt "$half" ] && conc=$half
              echo "self-hosted: about $used of $(nproc) threads busy"
            fi
            echo "self-hosted: $conc games at once"
          fi
          args=()
          for o in ${{ matrix.opts }}; do args+=(--opt "$o"); done
          opp=engines/opp
          case "${{ matrix.opp }}" in
            maia-*) opp=engines/lc0
                    args+=(--opp-opt "WeightsFile=engines/${{ matrix.opp }}.pb.gz" --opp-go "nodes 1") ;;
            maia3-*) opp=engines/maia3
                    elo="${{ matrix.opp }}"; elo="${elo#maia3-}"
                    args+=(--opp-opt "Elo=$elo" --opp-go "nodes 1")
                    for o in ${{ matrix.oppopts }}; do args+=(--opp-opt "$o"); done ;;
            ref)    opp=engines/ref
                    args+=(--opp-opt "Hash=16")
                    for o in ${{ matrix.oppopts }}; do args+=(--opp-opt "$o"); done ;;
          esac
          if [ "${{ matrix.ponder }}" = "true" ]; then args+=(--ponder); fi
          args+=(--opp-think "${{ matrix.think }}")
          python -I notes/scripts/match.py "out/${{ matrix.name }}-${{ matrix.chunk }}.jsonl" \
            engines/ours "$opp" ${{ matrix.elo }} ${{ matrix.games }} \
            --seed ${{ matrix.seed }} --conc "$conc" --tc "${{ matrix.tc }}" \
            --book notes/openings.txt "${args[@]}" | tail -1
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: res-${{ matrix.name }}-${{ matrix.chunk }}
          path: out/
          retention-days: 7

  collect:
    needs: [plan, match]
    if: always() && needs.plan.result == 'success'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: res-*
          path: res
          merge-multiple: true
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -q chess
      - name: Merge chunks and summarise
        run: |
          exp=${{ needs.plan.outputs.exp }}
          mkdir -p notes/results/$exp
          for f in res/*.jsonl; do
            b=$(basename "$f" .jsonl); name=${b%-*}
            cat "$f" >> "notes/results/$exp/$name.jsonl"
          done
          # Debugging output: unscored hung games and opponent stderr logs.
          shopt -s nullglob
          dbg=(res/*.hangs res/*.log)
          if [ ${#dbg[@]} -gt 0 ]; then
            mkdir -p "notes/results/$exp/debug"
            for f in "${dbg[@]}"; do [ -s "$f" ] && cp "$f" "notes/results/$exp/debug/"; done
          fi
          { echo '```'; python -I notes/scripts/summary.py notes/results/$exp/*.jsonl; echo '```'; } \
            | tee notes/results/$exp/SUMMARY.md >> "$GITHUB_STEP_SUMMARY"
      - name: Commit results
        run: |
          git config user.name "smother-exp bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add notes/results
          git commit -m "results: ${{ needs.plan.outputs.exp }} [skip ci]" && git push || echo "nothing to commit"
