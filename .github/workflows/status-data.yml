# Status data: builds status.json for the test status page
# (notes/scripts/status_data.py: progress and live results of recent tests,
# helper activity by ID, throughput) and publishes it on the gh-pages branch.
#
# Runs when an experiment, strength test or Helper kick in this repository
# finishes, on the 15-minute schedule (which
# GitHub may run late) and by hand. It holds no runner between updates (an
# earlier version chained itself with a sleeping job; Actions were briefly
# disabled on Nov 27 and that idle runner is the likeliest reason).
name: Status data

on:
  schedule:
    - cron: "3,18,33,48 * * * *"
  workflow_dispatch:
  workflow_run:
    workflows: ["Smother experiment", "SPRT", "Helper kick"]
    types: [completed]

permissions:
  contents: write
  actions: read

concurrency:
  group: status-data
  cancel-in-progress: false

jobs:
  build:
    if: github.repository == 'Demonic1594/Smotherfish'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: smotherfish
          path: main
          fetch-depth: 0
      - uses: actions/checkout@v4
        with:
          ref: gh-pages
          path: site
      - name: Build status.json
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 main/notes/scripts/status_data.py site/status.json site/status.json
      - name: Publish
        working-directory: site
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add status.json
          git diff --cached --quiet && { echo "no change"; exit 0; }
          git commit -q -m "Status data $(date -u +%Y-%m-%dT%H:%MZ)"
          git push -q
